<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bird = {
  x: 80,
  y: 250,
  size: 18,
  velocity: 0
};

let gravity = 0.35;
let lift = -7;
let pipeSpeed = 1.6;
let pipes = [];
let score = 0;
let gameOver = false;

function flap() {
  if (gameOver) {
    resetGame();
  } else {
    bird.velocity = lift;
  }
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") flap();
});

canvas.addEventListener("click", flap);

function resetGame() {
  bird.y = 250;
  bird.velocity = 0;
  pipes = [];
  score = 0;
  gameOver = false;
}

function createPipe() {
  const gap = 190;
  const minTop = 60;
  const maxTop = canvas.height - gap - 120;
  const topHeight = Math.random() * (maxTop - minTop) + minTop;

  pipes.push({
    x: canvas.width,
    topHeight,
    gap,
    width: 60,
    scored: false
  });
}

function update() {
  if (gameOver) return;

  bird.velocity += gravity;
  bird.y += bird.velocity;

  if (pipes.length === 0 || pipes[pipes.length - 1].x < 230) {
    createPipe();
  }

  pipes.forEach(pipe => {
    pipe.x -= pipeSpeed;

    // Smaller, fairer hitbox
    const birdLeft = bird.x - 13;
    const birdRight = bird.x + 13;
    const birdTop = bird.y - 18;
    const birdBottom = bird.y + 24;

    const pipeLeft = pipe.x;
    const pipeRight = pipe.x + pipe.width;
    const topPipeBottom = pipe.topHeight;
    const bottomPipeTop = pipe.topHeight + pipe.gap;

    const hitsPipe =
      birdRight > pipeLeft &&
      birdLeft < pipeRight &&
      (birdTop < topPipeBottom || birdBottom > bottomPipeTop);

    if (hitsPipe) {
      gameOver = true;
    }

    if (!pipe.scored && pipe.x + pipe.width < bird.x) {
      score++;
      pipe.scored = true;
    }
  });

  pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);

  if (bird.y + 24 > canvas.height || bird.y - 18 < 0) {
    gameOver = true;
  }
}
