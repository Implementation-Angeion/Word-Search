<div class="app">
  <button onclick="openPack()">Rip Pack</button>

  <div id="pack" class="pack">
    <div class="tear">✦ ✦ ✦</div>
    <span>ANGEION CARD PACK</span>
  </div>

  <div id="cards" class="cards"></div>
</div>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #101820;
    font-family: system-ui, sans-serif;
  }

  .app {
    text-align: center;
  }

  button {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    font-weight: 800;
    cursor: pointer;
    margin-bottom: 24px;
    background: #0099ff;
    color: white;
  }

  .pack {
    width: 240px;
    height: 340px;
    background: linear-gradient(135deg, #003f7f, #0099ff);
    border-radius: 18px;
    color: white;
    display: grid;
    place-items: center;
    font-weight: 900;
    letter-spacing: 2px;
    box-shadow: 0 20px 40px rgba(0,0,0,.45);
    position: relative;
    overflow: hidden;
    transition: transform .4s ease, opacity .4s ease;
  }

  .tear {
    position: absolute;
    top: 28px;
    width: 100%;
    border-top: 3px dashed rgba(255,255,255,.8);
    padding-top: 12px;
  }

  .pack.ripped {
    transform: rotate(-8deg) scale(.9) translateY(-30px);
    opacity: 0;
  }

  .cards {
    margin-top: 28px;
    display: flex;
    gap: 18px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .card {
    width: 165px;
    height: 250px;
    border-radius: 16px;
    background: white;
    color: #111;
    box-shadow: 0 14px 28px rgba(0,0,0,.4);
    padding: 14px;
    transform: translateY(40px) scale(.8);
    opacity: 0;
    animation: reveal .45s ease forwards;
    border: 4px solid #ddd;
  }

  .card img {
    width: 100%;
    height: 110px;
    object-fit: contain;
    border-radius: 10px;
    background: #f3f7fb;
  }

  .card h3 {
    margin: 12px 0 4px;
    font-size: 16px;
  }

  .rarity {
    font-weight: 900;
    font-size: 14px;
  }

  .odds {
    font-size: 12px;
    opacity: .75;
    margin-top: 4px;
  }

  .Common {
    border-color: #9ca3af;
  }

  .Uncommon {
    border-color: #22c55e;
  }

  .Rare {
    border-color: #0099ff;
  }

  .Epic {
    border-color: #7c3aed;
  }

  .Legendary {
    border-color: #f59e0b;
    box-shadow: 0 0 30px rgba(245,158,11,.65);
  }

  @keyframes reveal {
    to {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
  }
</style>

<script>
  const cardImages = {
    lightbulb: "https://www.angeiongroup.com/hs-fs/hubfs/lightbulb%20%281%29-1.png?height=1200&name=lightbulb+%281%29-1.png&width=982",
    greatPlace: "https://www.angeiongroup.com/hs-fs/hubfs/Angeion_Group_2025/logos/home/logo-certified.png?height=215&name=logo-certified.png&width=150"
  };

  const customCards = [
    {
      name: "Notice Navigator",
      rarity: "Common",
      chance: 22,
      image: cardImages.lightbulb
    },
    {
      name: "Claims Coordinator",
      rarity: "Common",
      chance: 20,
      image: cardImages.lightbulb
    },
    {
      name: "Case Manager",
      rarity: "Common",
      chance: 18,
      image: cardImages.greatPlace
    },
    {
      name: "Data Defender",
      rarity: "Uncommon",
      chance: 12,
      image: cardImages.lightbulb
    },
    {
      name: "Settlement Strategist",
      rarity: "Uncommon",
      chance: 10,
      image: cardImages.greatPlace
    },
    {
      name: "Fraud Prevention Shield",
      rarity: "Rare",
      chance: 6,
      image: cardImages.lightbulb
    },
    {
      name: "Notice Expert",
      rarity: "Rare",
      chance: 4,
      image: cardImages.greatPlace
    },
    {
      name: "EvidenceEngine Spark",
      rarity: "Epic",
      chance: 3,
      image: cardImages.lightbulb
    },
    {
      name: "Mega Summit Pass",
      rarity: "Epic",
      chance: 2,
      image: cardImages.greatPlace
    },
    {
      name: "Final Approval Hero",
      rarity: "Legendary",
      chance: 1,
      image: cardImages.lightbulb
    },
    {
      name: "Bonusly Champion",
      rarity: "Legendary",
      chance: 1,
      image: cardImages.greatPlace
    },
    {
      name: "Angeion All-Star",
      rarity: "Legendary",
      chance: 1,
      image: cardImages.lightbulb
    }
  ];

  function openPack() {
    const pack = document.getElementById("pack");
    const cardsContainer = document.getElementById("cards");

    cardsContainer.innerHTML = "";
    pack.classList.add("ripped");

    setTimeout(() => {
      const drawnCards = drawWeightedCards(customCards, 5);

      drawnCards.forEach((card, index) => {
        const cardEl = document.createElement("div");
        cardEl.className = `card ${card.rarity}`;
        cardEl.style.animationDelay = `${index * 0.15}s`;

        cardEl.innerHTML = `
          <img src="${card.image}" alt="${card.name}">
          <h3>${card.name}</h3>
          <div class="rarity">${card.rarity}</div>
          <div class="odds">${card.chance}% pull chance</div>
        `;

        cardsContainer.appendChild(cardEl);
      });

      setTimeout(() => {
        pack.classList.remove("ripped");
      }, 900);
    }, 450);
  }

  function drawWeightedCards(deck, count) {
    const selectedCards = [];

    for (let i = 0; i < count; i++) {
      selectedCards.push(drawOneWeightedCard(deck));
    }

    return selectedCards;
  }

  function drawOneWeightedCard(deck) {
    const totalChance = deck.reduce((sum, card) => sum + card.chance, 0);
    let random = Math.random() * totalChance;

    for (const card of deck) {
      random -= card.chance;

      if (random <= 0) {
        return card;
      }
    }

    return deck[deck.length - 1];
  }
</script>
