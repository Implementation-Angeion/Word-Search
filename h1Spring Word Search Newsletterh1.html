<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .box { padding: 20px; border: 2px solid #222; border-radius: 12px; }
    .grid { display: grid; grid-template-columns: repeat(8, 36px); gap: 5px; }
    .cell { border: 1px solid #aaa; padding: 10px; text-align: center; cursor: pointer; }
    .cell.selected { background: #ffe08a; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Word Search</h2>
    <p>Find: SPRING, RAIN, FLOWER</p>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const letters = "SPRINGABXFLOWERCRAINDEFGHIJKLMNO".split("");
    const grid = document.getElementById("grid");

    letters.forEach(letter => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = letter;
      cell.onclick = () => cell.classList.toggle("selected");
      grid.appendChild(cell);
    });
  </script>
</body>
</html>
